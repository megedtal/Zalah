<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צלח · מרכז המכירות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2440;
  --navy-2:#1B3A63;
  --accent:#D8232A;
  --stage:#E9EBEE;
  --sheet:#FFFFFF;
  --panel:#FFFFFF;
  --ink:#0D141B;
  --ink-2:#3A4653;
  --ink-3:#5E6B78;
  --rule:#DCE1E6;
  --rule-2:#EBEEF1;
  --zebra:#FAFBFC;
  --ui:"Assistant",-apple-system,"Segoe UI",sans-serif;
  --mono:"Assistant",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);font-size:16px;background:var(--panel);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;direction:ltr;display:inline-block;unicode-bidi:isolate}
.m{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  direction:ltr;unicode-bidi:isolate;display:inline-block}
.lbl{font-size:11.5px;font-weight:500;color:var(--ink-3)}

/* ══════ masthead ══════ */
.top{height:56px;background:var(--panel);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:0 20px;flex:none}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:30px;width:auto;display:block}
.top .bar{width:1px;height:18px;background:var(--rule)}
.top h1{font-size:15px;font-weight:500;color:var(--ink-2)}
.top .grow{flex:1}
.top .meta{font-size:13.5px;color:var(--ink-3)}
.top .av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:600}

/* ══════ frame ══════ */
.frame{display:grid;grid-template-columns:1fr 1fr 2fr;height:calc(100vh - 56px)}
.col{display:flex;flex-direction:column;min-height:0;border-inline-start:1px solid var(--rule);background:var(--panel)}
.col:first-child{border-inline-start:0}
.chead{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--rule);flex:none}
.chead .t{font-size:13px;font-weight:600;color:var(--ink-2)}
.chead .c{font-size:13px;color:var(--ink-3)}
.chead .grow{flex:1}
.srch{padding:10px 16px 0;flex:none}
.srch input{width:100%;border:1px solid var(--rule);border-radius:3px;padding:9px 12px;font-size:14.5px;outline:0;background:var(--panel)}
.srch input::placeholder{color:var(--ink-3)}
.srch input:focus{border-color:var(--ink-3)}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px 0 20px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D3D7DC;border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ══════ col 1 ══════ */
.mail{display:block;width:100%;padding:14px 18px;position:relative}
.mail:hover{background:var(--zebra)}
.mail[aria-current="true"]{background:#F2F4F6}
.mail[aria-current="true"]::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:2px;background:var(--accent)}
.mail .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mail .f{font-size:15px;font-weight:600}
.mail .t{font-size:13px;color:var(--ink-3);white-space:nowrap}
.mail .s{font-size:14px;color:var(--ink-2);line-height:1.55;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{display:flex;align-items:center;gap:9px;margin-top:9px}
.rmeta .rno{font-size:12.5px;color:var(--ink-3)}
.thread{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:13px;
  color:var(--ink-2);background:#EDF1F5;border-radius:3px;padding:3px 9px}
.thread svg{width:14px;height:14px;color:var(--ink-3)}

/* M365 sync strip */
.sync{display:flex;align-items:center;gap:8px;padding:11px 18px;margin-top:11px;
  border-top:1px solid var(--rule-2);font-size:13px;color:var(--ink-3)}
.sync .grow{flex:1}
.fetch{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2);
  border:1px solid var(--rule);border-radius:3px;padding:6px 12px;background:var(--panel)}
.fetch:hover{border-color:var(--ink-3);color:var(--ink)}
.fetch svg{width:13px;height:13px}
.fetch.busy{color:var(--ink-3);pointer-events:none}
.fetch.busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════ col 2 · the thread ══════ */
.ml{display:block;width:100%;padding:15px 18px;position:relative;border-bottom:1px solid var(--rule-2)}
.ml:hover{background:var(--zebra)}
.ml[aria-current="true"]{background:#EFF3F7}
.ml[aria-current="true"]::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:2px;background:var(--accent)}
.ml .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ml .f{font-size:14.5px;font-weight:600}
.ml .t{font-size:13px;color:var(--ink-3);white-space:nowrap}
.ml .sub{font-size:14px;color:var(--ink);margin-top:5px;line-height:1.5}
.ml .bd{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.7}
.ml .bd em{font-style:normal;color:var(--ink);box-shadow:inset 0 -2px 0 #F3D9A8}
.ml .ft{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-3)}
.ml .ext{display:inline-flex;align-items:center;gap:6px;background:#EDF1F5;color:var(--ink-2);
  border-radius:3px;padding:3px 9px;font-weight:500}
.ml .ext.none{background:none;padding:0;color:var(--ink-3);font-weight:400}
.nomail{padding:40px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.nomail svg{width:34px;height:34px;fill:none;stroke:var(--ink-3);stroke-width:1.3;
  stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.nomail .h{font-size:14.5px;font-weight:600;color:var(--ink-2);margin-top:4px}
.nomail .p{font-size:13.5px;color:var(--ink-3);line-height:1.7;max-width:250px}
.cpick{display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:start;width:100%;max-width:270px;margin-top:8px}
.cpick select{width:100%;border:1px solid var(--rule);border-radius:3px;padding:9px 10px;
  font:inherit;font-size:14px;background:var(--panel);color:var(--ink)}
.cpick select:hover{border-color:var(--ink-3)}
.row.hl{background:#FFF8EC}
.row.dim{opacity:.4}
.srcbar{display:none;align-items:center;gap:10px;padding:10px 22px;background:#FFF8EC;
  border-bottom:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.srcbar.on{display:flex}
.srcbar .grow{flex:1}
.srcbar button{font-size:13px;font-weight:500;color:var(--ink-2);border:1px solid var(--rule);
  border-radius:3px;padding:4px 11px;background:var(--panel)}
.srcbar button:hover{border-color:var(--ink);color:var(--ink)}

/* ══════ col 2 ══════ */
.qz{display:block;width:100%;padding:15px 18px;position:relative}
.qz:hover{background:var(--zebra)}
.qz[aria-current="true"]{background:#F2F4F6}
.qz[aria-current="true"]::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:2px;background:var(--accent)}
.qz .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qz .ti{font-size:15px;font-weight:600}
.qz .am{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.qz .m{display:flex;align-items:center;gap:9px;margin-top:8px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:3px;border:1px solid transparent;
  white-space:nowrap;display:inline-block}
.st-draft   {background:#EEF1F4;color:#4A5663;border-color:#DCE2E8}
.st-review  {background:#FDF2DA;color:#8A5A00;border-color:#F0DCA6}
.st-sent    {background:#E7F0FB;color:#14539E;border-color:#C4D9F2}
.st-accepted{background:#E5F4E9;color:#1B6E36;border-color:#BCE0C7}
.st-rejected{background:#FCEAEA;color:#A32220;border-color:#F2C9C8}
.qz .d{font-size:13px;color:var(--ink-3)}

/* ══════ col 3 ══════ */
.dhead{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--rule);flex:none}
.dhead .lead{font-size:14px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .lead b{color:var(--ink);font-weight:500}
.dhead .grow{flex:1}
.ico{width:32px;height:32px;border-radius:2px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.ico:hover{background:var(--rule-2);color:var(--ink)}
.ico.sm{width:26px;height:26px;margin-inline-end:-6px}
.ico.go{background:var(--accent);color:#fff}
.ico.go:hover{background:#B81C22;color:#fff}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);inset-inline-end:0;
  background:var(--ink);color:#fff;font-family:var(--ui);font-size:12px;white-space:nowrap;
  padding:4px 8px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:40}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}

.stage{flex:1;min-height:0;overflow-y:auto;background:var(--panel)}

/* quote header */
.qh{padding:20px 22px 18px;border-bottom:1px solid var(--rule)}
.qh .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qh h2{font-size:23px;font-weight:700;letter-spacing:-.015em}
.qh .no{font-size:14px;color:var(--ink-3)}
.qh .r2{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;
  font-size:14px;color:var(--ink-2)}
.qh .cust{font-weight:600;color:var(--ink)}
.qh .sepd{color:var(--rule-2);color:#C6CCD3}
.qh .warn{color:var(--accent);font-weight:500}

/* table */
.thead,.row{display:grid;grid-template-columns:56px minmax(0,1fr) 84px 106px 116px 126px 58px;
  gap:12px;align-items:center}
.thead{position:sticky;top:0;z-index:5;background:#EFF2F5;padding:12px 22px;
  border-bottom:1px solid var(--rule)}
.thead span{font-size:13px;font-weight:600;color:var(--ink-2)}
.c{text-align:center}
.e{text-align:end}
.row{padding:14px 22px;border-bottom:1px solid var(--rule-2)}
/* hairline that splits "what it is" from "what it costs" */
.thead>*:nth-child(3),.row>*:nth-child(3){
  border-inline-start:1px solid var(--rule-2);padding-inline-start:12px;margin-inline-start:-2px}
.row:hover{background:var(--zebra)}
.thumb{width:52px;height:52px;border:1px solid var(--rule);border-radius:3px;background:#F5F7F9;
  display:grid;place-items:center;color:#AEB7C0}
.thumb svg{width:22px;height:22px}
.row .nm{font-size:16px;font-weight:600;line-height:1.45}
.row .sk{font-size:13px;color:var(--ink-3);margin-top:5px}
.row .src{font-size:13.5px;color:var(--ink-2);margin-top:7px;padding-inline-start:10px;
  border-inline-start:2px solid #C3CDD6;line-height:1.5}
.row .src.man{color:var(--ink-3)}
.row .st{font-size:14px;color:var(--ink-2)}
.row .st.low{color:var(--accent)}
.row .up,.row .am{font-size:15px;font-variant-numeric:tabular-nums}
.row .up{color:var(--ink-2)}
.row .am{font-weight:700;font-size:15.5px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:3px;height:34px}
.qty button{width:30px;height:32px;color:var(--ink-2);font-size:17px;line-height:1}
.qty button:hover{background:var(--rule-2);color:var(--ink)}
.qty span{min-width:34px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.rowend{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.mini{width:28px;height:28px;border-radius:3px;display:grid;place-items:center;
  color:var(--ink-3);opacity:0;transition:opacity .12s;position:relative}
.row:hover .mini,.mini:focus-visible{opacity:1}
.mini:hover{background:var(--rule);color:var(--ink)}
.mini[disabled]{display:none}
.mini svg{width:16px;height:16px}

/* swap */
.swap{grid-column:1/-1;display:none;margin-top:10px;padding:12px 14px;background:#F7F9FA;border:1px solid var(--rule)}
.row.open .swap{display:block}
.alt{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--rule)}
.alt:first-of-type{border-top:0}
.alt .an{font-size:14.5px;font-weight:500}
.alt .as{font-size:13px;color:var(--ink-3);margin-top:3px}
.alt .grow{flex:1}
.alt .dd{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.alt .dd.save{color:var(--accent);font-weight:500}
.pick{font-size:13.5px;font-weight:500;border:1px solid var(--rule);border-radius:3px;padding:4px 12px;color:var(--ink-2);background:var(--panel)}
.pick:hover{border-color:var(--ink);color:var(--ink)}

/* add */
.addw{padding:16px 22px 22px}
.add{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;color:var(--ink-2);
  padding:12px 16px;width:100%;border:1px dashed var(--line,#CBD2D9);border-radius:3px}
.add:hover{color:var(--ink);border-color:var(--ink-3);background:var(--zebra)}
.picker{display:none;margin-top:8px;border:1px solid var(--rule);border-radius:3px}
.picker.open{display:block}
.picker input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:12px 16px;outline:0;font-size:14.5px}
.pl{max-height:230px;overflow-y:auto}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;border-top:1px solid var(--rule-2)}
.pi:first-child{border-top:0}
.pi:hover{background:var(--zebra)}
.pi .pn{font-size:14.5px;font-weight:500}
.pi .ps{font-size:13px;color:var(--ink-3);margin-top:3px}
.pi .grow{flex:1}
.pi .pp{font-size:14.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.empty{padding:14px;font-size:13px;color:var(--ink-3);text-align:center}

/* sticky foot */
.din{width:54px;height:30px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);
  text-align:center;direction:ltr;font-size:14px;font-weight:600;color:var(--ink);
  outline:0;padding:0;appearance:textfield;-moz-appearance:textfield}
.din::-webkit-outer-spin-button,.din::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.din:focus{border-color:var(--ink)}
.foot{flex:none;border-top:1px solid var(--rule);background:var(--panel);padding:0 22px;height:66px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.foot .k{font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.foot .m{font-size:15px;font-weight:600;color:var(--ink);min-width:76px;text-align:end}
.foot .sep{width:1px;height:18px;background:var(--rule);margin:0 7px}
.foot .kt{font-size:15px;color:var(--ink);font-weight:600}
.foot .tot{font-size:25px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.foot .grow{flex:1}
.foot .note{font-size:13.5px;color:var(--ink-3)}

.toast{font-weight:500;position:fixed;bottom:66px;inset-inline-start:50%;transform:translateX(50%) translateY(8px);
  background:var(--ink);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:2px;
  opacity:0;pointer-events:none;transition:.18s;z-index:60}
.toast.on{opacity:1;transform:translateX(50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1240px){
  .frame{grid-template-columns:1fr 1fr 2fr}
  .thead,.row{grid-template-columns:44px minmax(0,1fr) 70px 92px 90px 98px 48px;gap:8px;padding-inline:14px}
  .qh,.addw{padding-inline:14px}
}
@media (max-width:900px){
  body{overflow:auto}
  .frame{grid-template-columns:1fr;height:auto}
  .col{border-inline-start:0;border-top:1px solid var(--rule)}
  .list,.stage{overflow:visible}
  .thead{display:none}
  .row{grid-template-columns:44px minmax(0,1fr) auto;gap:8px}
  .row .st,.row .up{display:none}
  .mini{opacity:1}
  .foot{position:sticky;bottom:0;height:auto;padding:12px 16px}
}
@media print{
  .top,.col:not(.doc),.dhead,.foot,.addw,.rowend{display:none}
  .frame{display:block;height:auto}
  .stage{overflow:visible}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#" aria-label="צלח — הכל למקצוען">
    <img src="assets/tzlach-logo.png" alt="צלח — הכל למקצוען">
  </a>
  <span class="bar"></span>
  <h1>מרכז המכירות</h1>
  <span class="grow"></span>
  <span class="meta">נסרקו <span class="n">12</span> מיילים · <span class="n" id="topSync">09:44</span></span>
  <span class="bar"></span>
  <span class="av">א״כ</span>
</header>

<div class="frame">

  <!-- ═══ 1 · requests ═══ -->
  <section class="col">
    <div class="chead"><span class="t">בקשות מחיר</span><span class="grow"></span><span class="c" id="rCount">5</span>
      <button class="ico sm" data-tip="הצעת מחיר ידנית" onclick="newQuote()" aria-label="הצעת מחיר ידנית">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="srch"><input id="mSearch" placeholder="חיפוש לקוח או נושא" oninput="reqs()"></div>
    <div class="sync">
      <span>Microsoft 365 · סונכרן <span class="n" id="syncAt">09:44</span></span>
      <span class="grow"></span>
      <button class="fetch" id="fetchBtn" onclick="fetchNow()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-.7 4.3"/><path d="M20 5v6h-6"/></svg>
        משוך עכשיו
      </button>
    </div>
    <div class="list" id="reqs"></div>
  </section>

  <!-- ═══ 2 · the thread ═══ -->
  <section class="col">
    <div class="chead"><span class="t">מיילים בבקשה</span><span class="grow"></span><span class="c" id="eCount"></span></div>
    <div class="list" id="thread"></div>
  </section>

  <!-- ═══ 3 · document ═══ -->
  <section class="col doc">
    <div class="dhead">
      <span class="lead"><b id="hNo"></b> · <span id="hTitle"></span></span>
      <span class="grow"></span>
      <button class="ico" data-tip="שלח במייל" onclick="say('ההצעה נשלחה ללקוח')" aria-label="שלח במייל">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.6 6.6 12 13l8.4-6.4"/></svg></button>
      <button class="ico" data-tip="הורד PDF" onclick="say('הקובץ ירד')" aria-label="הורד PDF">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M5 19h14"/></svg></button>
      <button class="ico" data-tip="הדפס" onclick="window.print()" aria-label="הדפס">
        <svg class="i" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 19h10v-6H7z"/><path d="M7 9h10a2 2 0 0 1 2 2v4h-2M7 9a2 2 0 0 0-2 2v4h2"/></svg></button>

        <button class="mini" data-tip="החלף" onclick="openSwap(${i})" ${alts.length?"":"disabled"} aria-label="החלף פריט">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></button>
        <button class="mini" data-tip="הסר" onclick="drop(${i})" aria-label="הסר שורה">
          <svg class="i" viewBox="0 0 24 24"><path d="M6 7h12M10 7V5h4v2M8 7l.8 12h6.4L16 7"/></svg></button>
      </div>
      <div class="swap">
        <div class="lbl" style="margin-bottom:8px">חלופות במלאי</div>
        ${alts.map(a=>{
          const d=r2((a.price-p.price)*l.n);
          return `<div class="alt">
            <div><div class="an">${a.name}</div><div class="as">מק״ט <span class="n">${a.sku}</span> · במלאי <span class="n">${a.stock}</span></div></div>
            <span class="grow"></span>
            <span class="dd m ${d<0?"save":""}">${d<0?"−":"+"}${money(Math.abs(d))}</span>
            <button class="pick" onclick="event.stopPropagation();swapTo(${i},'${a.sku}')">החלף</button>
          </div>`;}).join("")}
      </div>
    </div>`;
  }).join("");
  renderPicker(); sums();
}

function renderPicker(){
  const box=document.getElementById("plist"); if(!box) return;
  const term=(document.getElementById("pSearch")?.value||"").trim();
  const used=new Set(s.lines.map(l=>l.sku));
  const hits=CAT.filter(p=>!used.has(p.sku))
    .filter(p=>!term||p.name.includes(term)||p.sku.includes(term)||p.brand.toLowerCase().includes(term.toLowerCase()));
  box.innerHTML=hits.length?hits.map(p=>`
    <button class="pi" onclick="addLine('${p.sku}')">
      <div><div class="pn">${p.name}</div><div class="ps">מק״ט <span class="n">${p.sku}</span> · <span class="n">${p.brand}</span> · במלאי <span class="n">${p.stock}</span></div></div>
      <span class="grow"></span><span class="pp m">${unit(p.price)}</span>
    </button>`).join(""):`<div class="empty">אין מוצר תואם</div>`;
}

function sums(){
  const sub=r2(s.lines.reduce((a,l)=>a+r2(P(l.sku).price*l.n),0));
  const dis=r2(sub*(s.disc/100));
  const net=r2(sub-dis);
  const vat=r2(net*VAT);
  document.getElementById("tSub").textContent=money(sub);
  document.getElementById("tDisc").textContent="−"+money(dis);
  document.getElementById("tVat").textContent=money(vat);
  document.getElementById("fTot").textContent=money(r2(net+vat));
  const units=s.lines.reduce((a,l)=>a+l.n,0);
  document.getElementById("qMeta").innerHTML=
    `<span class="n">${s.lines.length}</span> שורות · <span class="n">${units}</span> יחידות`;
  document.getElementById("fNote").textContent="כולל מע״מ";
  const late=s.lines.filter(l=>l.n>P(l.sku).stock).length;
  document.getElementById("qShip").innerHTML=
    late?`<span class="warn">${late} פריטים חסרים במלאי</span>`:"הכל במלאי, אספקה עד 3 ימי עסקים";
}

/* ── actions ── */
function setCust(name){
  if(!name) return;
  R(s.req).cust=name;
  reqs(); head();
  say("הלקוח עודכן · "+name);
}

let manualSeq=0;
function newQuote(){
  const now=new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
  const id="m"+(++manualSeq);
  REQS.unshift({id,cust:"טרם נבחר לקוח",subject:"הצעת מחיר ידנית",time:"היום "+now,mails:[],
    quote:{title:"הצעת מחיר ידנית",no:"DR-2026-"+String(155+manualSeq).padStart(4,"0"),state:"DRAFT",lines:[]}});
  document.getElementById("mSearch").value="";
  pickReq(id);
  say("נפתחה הצעת מחיר ידנית");
}
function pickReq(id){ s.req=id; s.focus=null; load(); reqs(); thread(); head(); srcbar(); }
function focusMail(id){
  s.focus = s.focus===id ? null : id;
  thread(); rows(); srcbar();
}
function clearFocus(){ s.focus=null; thread(); rows(); srcbar(); }
function srcbar(){
  const bar=document.getElementById("srcbar");
  if(!s.focus){ bar.classList.remove("on"); return; }
  const m=R(s.req).mails.find(x=>x.id===s.focus);
  const c=s.lines.filter(l=>l.from===s.focus).length;
  document.getElementById("srcTxt").innerHTML=
    `מוצגות <span class="n">${c}</span> שורות שחולצו מהמייל של ${m.from} · ${m.time}`;
  bar.classList.add("on");
}
function load(){
  s.lines=R(s.req).quote.lines.map(l=>({sku:l.sku,n:l.n,src:l.src,from:l.from}));
  rows();
}
function qty(i,d){ s.lines[i].n=Math.max(1,s.lines[i].n+d); rows(); }
function drop(i){ s.lines.splice(i,1); rows(); srcbar(); say("השורה הוסרה"); }
function swapTo(i,sku){ s.lines[i]={sku,n:s.lines[i].n,src:null,from:s.lines[i].from}; rows(); say("הפריט הוחלף"); }
function openSwap(i){ document.getElementById("r"+i).classList.toggle("open"); }
function addLine(sku){ s.lines.push({sku,n:1,src:null,from:null}); rows(); say("הפריט נוסף"); }
function togglePicker(){
  document.getElementById("picker").classList.toggle("open");
  document.getElementById("pSearch").focus();
}
document.getElementById("disc").addEventListener("input",e=>{
  s.disc=Math.min(40,Math.max(0,+e.target.value||0)); sums();
});

function fetchNow(){
  const b=document.getElementById("fetchBtn");
  b.classList.add("busy");
  say("מושך מיילים חדשים מ־Microsoft 365…");
  setTimeout(()=>{
    const now=new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
    document.getElementById("syncAt").textContent=now;
    document.getElementById("topSync").textContent=now;
    b.classList.remove("busy");
    say("אין בקשות חדשות · נסרקו 12 מיילים");
  },1400);
}

let t;
function say(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("on");
  clearTimeout(t); t=setTimeout(()=>el.classList.remove("on"),2000);
}

reqs(); thread(); head(); load();
</script>
</body>
</html>
